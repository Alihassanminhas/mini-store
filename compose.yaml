services:
  database:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: mini_store
      POSTGRES_USER: mini_store
      POSTGRES_PASSWORD: local_dev_password
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mini_store -d mini_store"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrate:
    build:
      context: .
      dockerfile: backend/Dockerfile
    command: ["node", "backend/dist/scripts/migrate.js"]
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://mini_store:local_dev_password@database:5432/mini_store
      JWT_SECRET: local-compose-only-change-this-secret-before-any-shared-use
      FRONTEND_URL: http://localhost:8080
    depends_on:
      database:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: postgresql://mini_store:local_dev_password@database:5432/mini_store
      JWT_SECRET: local-compose-only-change-this-secret-before-any-shared-use
      FRONTEND_URL: http://localhost:8080
    ports:
      - "4000:4000"
    depends_on:
      migrate:
        condition: service_completed_successfully

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:4000/api
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data:
